---
name: Check URLs

on:
  push:
    branches:
      - main
      - devel
      - pre-release
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - devel
      - pre-release
  workflow_dispatch:
    inputs:
      r-version:
        description: "The version of R to use"
        default: "release"
        required: false
        type: choice
        options:
          - devel
          - release
          - oldrel
  workflow_call:
    inputs:
      r-version:
        description: "The version of R to use"
        default: "release"
        required: false
        type: string

concurrency:
  group: links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Validate Links
    runs-on: ubuntu-latest
    if: >
      !contains(github.event.commits[0].message, '[skip links]')
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r-version || 'release' }}
          use-public-rspm: true

      # pandoc and xml2 are required by tools to extract URLs from README.md and NEWS.md
      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::curl, any::xml2

      - name: Check URLs as CRAN does
        run: |
          # Collect the URLs CRAN checks, i.e., those in DESCRIPTION, the Rd
          # files, CITATION, NEWS, README.md, and NEWS.md
          db <- tools:::url_db_from_package_sources(".")

          # CRAN does not check the vignette sources, so collect their URLs as
          # well. The same pandoc based extraction as for README.md is used.
          # Only absolute http(s) URLs are checked, i.e., links to other
          # vignettes or help pages are skipped.
          vignette_files <- list.files(
            "vignettes",
            pattern = "[.](Rmd|qmd|md)$", ignore.case = TRUE,
            recursive = TRUE, full.names = TRUE
          )
          vignette_db <- do.call(rbind, lapply(vignette_files, function(file) {
            html <- tempfile(fileext = ".html")
            on.exit(unlink(html))
            out <- tools:::.pandoc_md_for_CRAN(file, html)
            urls <- if (!out$status) tools:::.get_urls_from_HTML_file(html) else character()
            tools:::url_db(urls, rep.int(file, length(urls)))
          }))
          if (!is.null(vignette_db)) {
            vignette_db <- vignette_db[grepl("^https?://", vignette_db$URL), , drop = FALSE]
            db <- rbind(db, vignette_db)
          }

          # Check the URLs the same way `R CMD check --as-cran` does. For the
          # URLs collected above by url_db_from_package_sources() this is what
          # tools::check_package_urls() does, it is not called directly because
          # the vignette URLs are checked as well.
          res <- tools:::check_url_db(db, parallel = TRUE)

          # Drop URLs matching any pattern listed in .lycheeignore
          ignore <- character()
          if (file.exists(".lycheeignore")) {
            ignore <- trimws(readLines(".lycheeignore", warn = FALSE))
            ignore <- ignore[nzchar(ignore) & !startsWith(ignore, "#")]
          }
          is_ignored <- function(url) {
            any(vapply(ignore, function(pattern) {
              tryCatch(
                grepl(pattern, url, perl = TRUE),
                error = function(e) grepl(pattern, url, fixed = TRUE)
              )
            }, logical(1)))
          }
          ignored_urls <- character()
          if (NROW(res) > 0 && length(ignore) > 0) {
            ignored <- vapply(res$URL, is_ignored, logical(1))
            if (any(ignored)) {
              ignored_urls <- unique(res$URL[ignored])
              cat("Ignoring URLs listed in .lycheeignore:\n")
              cat(paste("-", ignored_urls), sep = "\n")
            }
            res <- res[!ignored, , drop = FALSE]
          }

          # Locate the source lines a URL occurs in, to ease fixing it
          source_files <- list.files(
            ".",
            pattern = "\\.(R|Rd|Rmd|md|yml|yaml)$|^(DESCRIPTION|NEWS|CITATION)$",
            ignore.case = TRUE, recursive = TRUE, all.files = TRUE
          )
          source_files <- source_files[
            !startsWith(source_files, ".git/") & source_files != "links-results.md"
          ]
          source_lines <- lapply(source_files, function(file) {
            tryCatch(readLines(file, warn = FALSE), error = function(e) character())
          })
          names(source_lines) <- source_files
          max_hits <- 20
          locate <- function(url) {
            # The URL must not be followed by a character which would make it
            # part of a longer URL, e.g., ".../admiral" must not match
            # ".../admiral/reference"
            pattern <- paste0("\\Q", url, "\\E(?![[:alnum:]/_~:?#@&%+=-]|\\.[[:alnum:]])")
            hits <- unlist(lapply(source_files, function(file) {
              found <- grep(pattern, source_lines[[file]], perl = TRUE)
              if (length(found) > 0) sprintf("%s:%s", file, found) else NULL
            }))
            if (length(hits) == 0) {
              "not found in the sources"
            } else if (length(hits) > max_hits) {
              c(hits[seq_len(max_hits)], sprintf("... and %d more", length(hits) - max_hits))
            } else {
              hits
            }
          }

          # Write markdown report to file and job summary
          md_escape <- function(x) gsub("|", "\\|", x, fixed = TRUE)
          advice <- paste(
            "If the URLs are acceptable, e.g., they are valid but cannot be reached from CI,",
            "add them to the `.lycheeignore` file."
          )
          if (NROW(res) == 0) {
            summary_md <- c(
              "# URL Check",
              "",
              ":white_check_mark: No problems found.",
              "",
              sprintf(
                "Checked %d URL(s) in the package sources and the vignettes.",
                NROW(db)
              ),
              if (length(ignored_urls) > 0) {
                c(
                  "",
                  "The following URLs were ignored because they are listed in `.lycheeignore`:",
                  "",
                  paste("-", ignored_urls)
                )
              }
            )
            details_md <- NULL
          } else {
            from <- vapply(res$From, paste, character(1), collapse = ", ")
            status <- ifelse(nzchar(res$Status), res$Status, "-")
            new <- ifelse(nzchar(res$New), paste("Moved to", res$New), "")
            details <- trimws(paste(res$Message, new))
            summary_md <- c(
              "# URL Check",
              "",
              sprintf(
                ":x: Found %d problematic URL(s). CRAN will flag those which are not in a vignette.",
                NROW(res)
              ),
              "",
              advice,
              "",
              "| URL | Found in | Status | Details |",
              "|-----|----------|--------|---------|",
              sprintf(
                "| %s | %s | %s | %s |",
                md_escape(res$URL), md_escape(from), md_escape(status), md_escape(details)
              )
            )
            # The report contains more than the job summary: where each URL
            # occurs in the sources and what to change it to
            details_md <- c(
              "",
              "## Details",
              unlist(lapply(seq_len(NROW(res)), function(i) {
                c(
                  "",
                  sprintf("### %s", res$URL[i]),
                  "",
                  sprintf("- Status: %s %s", status[i], res$Message[i]),
                  if (nzchar(res$New[i])) {
                    sprintf("- Redirects to: %s (use this URL instead)", res$New[i])
                  },
                  if (nzchar(res$CRAN[i])) sprintf("- CRAN: %s", res$CRAN[i]),
                  "- Occurs in:",
                  paste("  -", locate(res$URL[i]))
                )
              }))
            )
          }
          report_md <- c(
            summary_md,
            details_md,
            "",
            "---",
            "",
            sprintf(
              "Produced by the `links` workflow for %s@%s on %s.",
              Sys.getenv("GITHUB_REPOSITORY", "the package"),
              substr(Sys.getenv("GITHUB_SHA", "local"), 1, 7),
              format(Sys.time(), "%Y-%m-%d %H:%M:%S %Z")
            )
          )
          writeLines(report_md, "links-results.md")
          summary_file <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (nzchar(summary_file)) {
            cat(
              c(summary_md, "", "The `links-results.md` artifact lists where each URL occurs."),
              file = summary_file, sep = "\n", append = TRUE
            )
          }

          if (NROW(res) > 0) {
            # Include the URLs in the error itself, so that all the information
            # is in one place instead of being printed before the error
            stop(
              paste(
                c(
                  paste(
                    "Found problematic URLs. See the job summary or download the",
                    "links-results.md artifact using the link at the bottom of the",
                    "\"Upload results\" section for further details.",
                    advice
                  ),
                  "",
                  sprintf(
                    "* %s (%s %s) in %s",
                    res$URL, status, res$Message, from
                  )
                ),
                collapse = "\n"
              ),
              call. = FALSE
            )
          }
          cat("All URLs are OK.\n")
        shell: Rscript {0}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: links-results
          path: links-results.md
          if-no-files-found: ignore
